name: Setup Docker Builder
author: Blacksmith
description: Sets up a Docker buildkitd builder with sticky disk cache for improved build performance
branding:
  icon: layers
  color: black
inputs:
  cache-key:
    description: >-
      Unique identifier for this build's Docker layer cache. Builds with the
      same cache-key share cached layers across runs. Set this to the Dockerfile
      being built (e.g., services/api/Dockerfile). Jobs building different
      Dockerfiles should use different cache-keys to avoid cache thrashing.
    required: true
  buildx-version:
    description: Buildx version. (e.g., v0.23.0, latest)
    required: false
    default: v0.23.0
  platforms:
    description: "List of target platforms for build (e.g., linux/amd64,linux/arm64,linux/arm/v7)"
    required: false
  nofallback:
    description: "If true, fail the action if Blacksmith builder setup fails instead of falling back to local builder"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for GitHub API access"
    required: false
  buildkit-version:
    description: "BuildKit version to install (e.g., v0.16.0, v0.18.0). If not specified, uses system default"
    required: false
  skip-integrity-check:
    description: "Deprecated: the bbolt database integrity check has been removed; this input has no effect"
    required: false
    default: "false"
  driver-opts:
    description: "List of additional driver-specific options (e.g., env.VARIABLE=value)"
    required: false
  max-parallelism:
    description: "Maximum number of concurrent BuildKit RUN steps. Defaults to the number of vCPUs on the runner."
    required: false
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
